<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#2F2858"/>
<title>影片製作流程 · 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#5B4FE0;--purple-dark:#3F35A8;--purple-light:#EFEDFF;
  --ink:#171321;--gold:#C9A24B;
  --border:#E7E4F0;--bg:#fff;--bg2:#F7F6FB;
  --text:#1A1626;--text2:#5C5670;--text3:#A39FB5;
  --radius:10px;--radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(23,19,33,.05),0 1px 1px rgba(23,19,33,.03);
  --shadow-md:0 6px 20px -4px rgba(60,52,137,.12),0 2px 6px rgba(23,19,33,.05);
  --shadow-lg:0 16px 48px -8px rgba(60,52,137,.22),0 4px 16px rgba(23,19,33,.08);
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Plus Jakarta Sans','Inter',-apple-system,sans-serif;
}
body.dark-mode{
  --border:#332F42;--bg:#1C1926;--bg2:#141220;
  --text:#EDEBF5;--text2:#AFA9C4;--text3:#726C85;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.22);
  --shadow-md:0 6px 20px -4px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.28);
  --shadow-lg:0 16px 48px -8px rgba(0,0,0,.6),0 4px 16px rgba(0,0,0,.32);
}
body{font-family:var(--font-body);color:var(--text);background:var(--bg2);min-height:100vh;background-image:radial-gradient(circle at 0% 0%,rgba(91,79,224,.05),transparent 45%),radial-gradient(circle at 100% 0%,rgba(201,162,75,.05),transparent 40%);transition:background-color .2s,color .2s}
body.dark-mode{background-image:radial-gradient(circle at 0% 0%,rgba(91,79,224,.1),transparent 45%),radial-gradient(circle at 100% 0%,rgba(201,162,75,.07),transparent 40%)}
body.dark-mode img:not(.no-dark-dim){filter:brightness(.92)}

.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;background:linear-gradient(165deg,#1C1730 0%,#241D3D 100%);box-shadow:0 4px 16px -6px rgba(23,19,33,.35)}
.topbar-title{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:18px;font-weight:600;color:#fff}
.topbar-title .logo-badge{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--purple) 0%,#8A7FFF 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(91,79,224,.5)}
.topbar-title .logo-badge i{color:#fff;font-size:16px}
.dark-toggle{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.dark-toggle:hover{background:rgba(255,255,255,.12)}
.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 80px}
@media (max-width:640px){ .page-wrap{padding:18px 14px 70px} .topbar{padding:14px 16px} }

button{font-family:inherit}
.btn-primary{display:flex;align-items:center;gap:6px;padding:11px 20px;background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .12s cubic-bezier(.34,1.56,.64,1)}
.btn-primary:hover{box-shadow:var(--shadow-md)}
.btn-primary:active{transform:scale(.96)}
.btn-ghost{padding:9px 15px;border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;background:transparent;cursor:pointer;color:var(--text2);transition:background .12s,border-color .12s,transform .1s}
.btn-ghost:hover{background:var(--bg2);border-color:#D8D2F2;color:var(--text)}
.btn-ghost:active{transform:scale(.96)}
.icon-btn{padding:7px;border:none;background:transparent;cursor:pointer;color:var(--text3);border-radius:8px;display:flex;align-items:center;font-size:15px;line-height:1;transition:background .12s,color .12s,transform .1s}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.active-toggle{background:var(--purple-light);color:var(--purple)}
.form-label{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:6px;display:block}
.form-group{margin-bottom:14px}
.sn-insp-prompt-box{background:var(--bg2);border:1px dashed var(--border);border-radius:12px;padding:14px 16px;margin-top:8px}
.sn-insp-prompt-en{font-size:14px;color:var(--text);line-height:1.75;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-word}
input,select,textarea{font-family:inherit;color:inherit;font-size:14px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg2);font-size:14px}
.inp:focus{outline:none;border-color:var(--purple);background:var(--bg)}

/* ent-page shared layout */
.ent-page{max-width:820px;padding-bottom:40px}
.ent-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.ent-header-title{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px}
.ent-header-sub{font-size:14px;color:var(--text3);margin-top:5px;line-height:1.6;max-width:52ch}
.ent-empty{text-align:center;padding:70px 20px;color:var(--text3);font-size:15px;line-height:1.8}

/* 🎬 影片製作流程 — 專案卡片 */
.vf-project-card{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.vf-project-head{display:flex;align-items:center;gap:12px;cursor:pointer}
.vf-project-title{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px}
.vf-project-meta{font-size:13px;color:var(--text3);margin-top:4px}
.vf-progress-bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:12px}
.vf-progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),#8b5cf6);border-radius:99px;transition:width .3s}

/* 步驟時間軸：加大點擊區、加大字級，讓整條流程一眼就能看懂進度 */
.vf-steps{margin-top:22px;padding-left:2px;display:flex;flex-direction:column}

/* 精靈模式：一次只顯示目前這一步，配上一步／下一步導覽 */
.vf-wizard{margin-top:22px}
.vf-wizard-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.vf-wizard-count{font-size:13px;font-weight:700;color:var(--text2);flex-shrink:0}
.vf-wizard-nav .btn-ghost{font-size:13px}
.vf-wizard-nav .btn-ghost:disabled{opacity:.4;cursor:default;pointer-events:none}
.vf-wizard .vf-step{padding-left:44px}
.vf-wizard-done-msg{margin-top:16px;text-align:center;font-size:14px;font-weight:600;color:#2e7d32;background:rgba(46,125,50,.1);border-radius:12px;padding:16px}
.vf-step{position:relative;padding-left:44px;padding-bottom:22px}
.vf-step:last-child{padding-bottom:0}
.vf-step::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border)}
.vf-step:last-child::before{display:none}
.vf-step-dot{position:absolute;left:0;top:1px;width:32px;height:32px;border-radius:50%;background:var(--bg2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text3);cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s}
.vf-step.done .vf-step-dot{background:var(--purple);border-color:var(--purple);color:#fff}
.vf-step-head{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:32px;flex-wrap:wrap;row-gap:4px}
.vf-step-title{font-size:15.5px;font-weight:600;color:var(--text)}
.vf-step.done .vf-step-title{color:var(--text2)}
.vf-step-tool{font-size:12px;font-weight:600;color:var(--purple-dark);background:var(--purple-light);padding:3px 10px;border-radius:99px}
.vf-step-done-badge{font-size:11px;font-weight:700;color:#fff;background:var(--purple);padding:3px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:3px;flex-shrink:0}
.vf-step-body{margin-top:12px;background:var(--bg2);border-radius:14px;padding:16px 18px}
.vf-step-desc{font-size:14px;color:var(--text2);line-height:1.75;margin-bottom:14px}
.vf-step-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.vf-step-nolink{font-size:13px;color:var(--purple-dark);background:var(--purple-light);border-radius:10px;padding:10px 13px;margin-bottom:10px;line-height:1.6}
.vf-prompt-preview{max-height:110px;overflow:hidden;position:relative;background:#fff;border-color:#e2e2e2}
.vf-prompt-preview .sn-insp-prompt-en{color:#1a1a1a}
.vf-prompt-preview::after{content:'';position:absolute;left:0;right:0;bottom:0;height:32px;background:linear-gradient(transparent,#fff)}
.vf-prompt-preview.expanded{max-height:none;overflow:visible}
.vf-prompt-preview.expanded::after{display:none}
.vf-prompt-version-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.vf-prompt-version-tab{padding:6px 13px;font-size:12.5px;font-weight:600;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s,transform .1s}
.vf-prompt-version-tab:hover{color:var(--text);border-color:#D8D2F2}
.vf-prompt-version-tab:active{transform:scale(.95)}
.vf-prompt-version-tab.active{background:linear-gradient(135deg,var(--purple) 0%,#8b5cf6 100%);color:#fff;border-color:transparent;box-shadow:0 3px 10px -3px rgba(91,79,224,.5)}

/* ── 工具列：搜尋單獨一列，其他篩選/排序/檢視選項收在同一列並允許換行，降低擁擠感 ── */
.vf-toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.vf-toolbar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vf-toolbar-search{flex:1 1 220px;min-width:0;position:relative}
.vf-toolbar-search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3)}
.vf-toolbar-search input{width:100%;padding:10px 12px 10px 36px;font-size:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text)}
.vf-toolbar-search input:focus{outline:none;border-color:var(--purple)}
.vf-toolbar select{padding:9px 11px;font-size:13.5px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);cursor:pointer}
.vf-toolbar-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:13.5px;font-weight:600;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;white-space:nowrap}
.vf-toolbar-btn:hover{color:var(--text);border-color:var(--purple)}
.vf-toolbar-btn.active{background:linear-gradient(135deg,var(--purple) 0%,#8b5cf6 100%);color:#fff;border-color:transparent}
.vf-stats-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:2px}
.vf-stats-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.vf-stats-num{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--purple)}
.vf-stats-label{font-size:12px;color:var(--text3);margin-top:4px}
.vf-project-card.archived{opacity:.62}
.vf-project-card.archived .vf-project-title{text-decoration:line-through;text-decoration-color:var(--text3)}

/* ── 左側專案選單：不同影片專案改成清單列在左邊，右邊只顯示選中的那一個 ── */
.vf-layout{display:flex;gap:20px;align-items:flex-start}
.vf-sidebar{width:250px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:14px;position:sticky;top:82px;max-height:calc(100vh - 110px);overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.vf-sidebar-add{width:100%;justify-content:center}
.vf-sidebar-search{position:relative}
.vf-sidebar-search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3)}
.vf-sidebar-search input{width:100%;padding:9px 10px 9px 32px;font-size:13.5px;border:1px solid var(--border);border-radius:9px;background:var(--bg2);color:var(--text)}
.vf-sidebar-search input:focus{outline:none;border-color:var(--purple)}
.vf-sidebar-toolrow{display:flex;gap:6px;flex-wrap:wrap}
.vf-sidebar-toolbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 8px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;white-space:nowrap}
.vf-sidebar-toolbtn:hover{color:var(--text);border-color:#D8D2F2}
.vf-sidebar-toolbtn.active{background:linear-gradient(135deg,var(--purple) 0%,#8b5cf6 100%);color:#fff;border-color:transparent}
.vf-sidebar select{width:100%}
.vf-sidebar-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.vf-sidebar-item{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s}
.vf-sidebar-item:hover{background:var(--bg2)}
.vf-sidebar-item.active{background:var(--purple-light);border-color:var(--purple)}
.vf-sidebar-item.archived{opacity:.6}
.vf-sidebar-thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg2);border:1px solid var(--border)}
.vf-sidebar-item-body{min-width:0;flex:1}
.vf-sidebar-item-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:4px}
.vf-sidebar-item.active .vf-sidebar-item-title{color:var(--purple-dark)}
.vf-sidebar-item-meta{font-size:11px;color:var(--text3);margin-top:2px}
.vf-sidebar-mini-bar{height:4px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:5px}
.vf-sidebar-mini-fill{height:100%;background:linear-gradient(90deg,var(--purple),#8b5cf6);border-radius:99px}
.vf-main{flex:1;min-width:0}
.vf-main-empty{text-align:center;padding:70px 20px;color:var(--text3);font-size:14px;line-height:1.8;background:var(--bg);border:1px dashed var(--border);border-radius:16px}
@media (max-width:860px){
  .vf-layout{flex-direction:column}
  .vf-sidebar{width:100%;position:static;max-height:none}
  .vf-sidebar-list{flex-direction:row;overflow-x:auto;overflow-y:visible;padding-bottom:2px}
  .vf-sidebar-item{flex-shrink:0;min-width:168px}
}
.vf-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.vf-stall-badge{font-size:11px;font-weight:700;color:#B5591A;background:rgba(201,162,75,.16);padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:3px;margin-left:8px}
.vf-done-all-badge{font-size:11px;font-weight:700;color:#2e7d32;background:rgba(46,125,50,.12);padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:3px;margin-left:8px}
.vf-step.hidden-step{opacity:.5}
.vf-step-skip-toggle{font-size:12px;color:var(--text3);cursor:pointer;padding:4px 9px;border-radius:8px;flex-shrink:0}
.vf-step-skip-toggle:hover{color:var(--text);background:var(--bg)}
.vf-step-skipped-note{font-size:13px;color:var(--text3);padding:8px 0 0 0;display:flex;align-items:center;gap:6px}
.vf-cover-upload{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.vf-cover-thumb-lg{width:76px;height:76px;border-radius:11px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.vf-yt-preview{display:flex;align-items:center;gap:11px;margin-top:10px;padding:10px 12px;background:#fff;border-radius:11px;border:1px solid var(--border)}
.vf-yt-preview img{width:76px;height:43px;object-fit:cover;border-radius:6px;flex-shrink:0}
.vf-yt-preview a{font-size:13px;color:var(--purple);text-decoration:none;word-break:break-all}
.vf-insert-row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text3);cursor:pointer;padding:6px 0 6px 44px;margin:-2px 0;opacity:.6;transition:opacity .12s,color .12s;user-select:none}
.vf-insert-row:hover{opacity:1;color:var(--purple)}
.vf-step.custom-step{padding-bottom:22px}
.vf-step.custom-step .vf-step-dot{background:var(--purple-light);border-color:var(--purple)}
.vf-step.custom-step.done .vf-step-dot{background:var(--purple);border-color:var(--purple)}
.vf-step.custom-step .vf-step-title{color:var(--purple-dark)}
.icon-btn.has-note{color:#B5591A;position:relative}
.icon-btn.has-note::after{content:'';position:absolute;top:3px;right:2px;width:7px;height:7px;border-radius:50%;background:#F0C24B;border:1.5px solid var(--bg)}
.vf-sticky-note{margin-top:14px;background:#FFF6D6;border:1px solid #F0D98C;border-radius:12px 12px 12px 3px;padding:12px 14px 13px;box-shadow:0 3px 10px -4px rgba(180,140,20,.35);transform:rotate(-.3deg)}
body.dark-mode .vf-sticky-note{background:#3A3320;border-color:#5C512E}
.vf-sticky-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;font-size:12px;font-weight:700;color:#8A6A1A}
.vf-sticky-close{cursor:pointer;color:#8A6A1A;opacity:.7}
.vf-sticky-close:hover{opacity:1}
.vf-sticky-textarea{width:100%;border:none;background:transparent;resize:vertical;min-height:52px;font-size:14px;color:#4A3B10;font-family:inherit;line-height:1.6}
.vf-sticky-textarea:focus{outline:none}
body.dark-mode .vf-sticky-textarea{color:#EDE0B8}

/* 展開時的卡片：加一圈強調色外框，讓「目前在哪」一眼可見，捲動定位也更明確 */
.vf-project-card.expanded{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-light),var(--shadow-md)}
.vf-step.expanded .vf-step-dot{box-shadow:0 0 0 4px var(--purple-light)}

/* toast */
.toast-stack{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column-reverse;gap:8px;align-items:center;pointer-events:none;max-width:92vw}
.toast-item{position:relative;display:flex;align-items:flex-start;gap:9px;background:#1A1826;color:#fff;padding:10px 16px 10px 13px;border-radius:11px;font-size:12.5px;line-height:1.5;max-width:420px;white-space:normal;overflow:hidden;pointer-events:auto;cursor:pointer;border-left:3px solid var(--toast-accent,var(--purple));box-shadow:0 10px 30px -8px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.22);opacity:0;transform:translateY(14px) scale(.94);transition:opacity .32s cubic-bezier(.34,1.56,.64,1),transform .32s cubic-bezier(.34,1.56,.64,1)}
.toast-item.show{opacity:1;transform:translateY(0) scale(1)}
.toast-item.hide{opacity:0;transform:translateY(-6px) scale(.95);transition:opacity .2s ease,transform .2s ease}
.toast-item:hover{transform:translateY(-1px) scale(1.01)}
.toast-icon{flex-shrink:0;width:17px;height:17px;display:flex;align-items:center;justify-content:center;margin-top:1px;color:var(--toast-accent,var(--purple));font-size:14px}
.toast-msg{flex:1}
.toast-progress{position:absolute;left:0;bottom:0;height:2px;background:var(--toast-accent,var(--purple));opacity:.5;animation:toastShrink 3.4s linear forwards}
@keyframes toastShrink{from{width:100%}to{width:0%}}
.toast-action-btn{flex-shrink:0;margin:0 2px;padding:3px 10px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(255,255,255,.12);color:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:background .12s}
.toast-action-btn:hover{background:rgba(255,255,255,.24)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title"><span class="logo-badge"><i class="ti ti-movie"></i></span>影片製作流程</div>
  <div style="display:flex;align-items:center;gap:8px">

const isDataUrl = v => typeof v==='string' && v.indexOf('data:')===0;

// ── Toast 通知 ──
const TOAST_TYPES = [
  {match:'✅', icon:'ti-circle-check', color:'#3FAE6B'},
  {match:'⚠️', icon:'ti-alert-triangle', color:'var(--gold)'},
  {match:'❌', icon:'ti-circle-x', color:'#E0524F'},
  {match:'☁️', icon:'ti-cloud', color:'var(--purple)'}
];
let _toastSeq = 0;
function toast(msg, opts) {
  const stack = document.getElementById('toast-stack');
  if(!stack) return;
  opts = opts || {};
  const found = TOAST_TYPES.find(t => msg.startsWith(t.match));
  const cleanMsg = found ? msg.slice(found.match.length).trim() : msg;
  const id = 'toast-' + (++_toastSeq);
  const hasAction = !!(opts.actionLabel && typeof opts.onAction === 'function');
  const duration = hasAction ? 5000 : 3400;
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.id = id;
  el.style.setProperty('--toast-accent', found ? found.color : 'var(--text3)');
  el.innerHTML = `<span class="toast-icon"><i class="ti ${found ? found.icon : 'ti-bell'}"></i></span>`
    + `<span class="toast-msg">${esc(cleanMsg)}</span>`
    + (hasAction ? `<button type="button" class="toast-action-btn">${esc(opts.actionLabel)}</button>` : '')
    + `<span class="toast-progress" style="animation-duration:${duration}ms"></span>`;
  if(hasAction){
    const btn = el.querySelector('.toast-action-btn');
    btn.onclick = (e) => { e.stopPropagation(); try{ opts.onAction(); }catch(err){ console.error(err); } dismissToast(id); };
  }
  el.onclick = () => dismissToast(id);
  stack.appendChild(el);
  const items = stack.querySelectorAll('.toast-item');
  if(items.length > 4) dismissToast(items[0].id);
  requestAnimationFrame(() => el.classList.add('show'));
  el._toastTimer = setTimeout(() => dismissToast(id), duration);
}
function dismissToast(id){
  const el = document.getElementById(id);
  if(!el) return;
  clearTimeout(el._toastTimer);
  el.classList.remove('show');
  el.classList.add('hide');
  setTimeout(() => { if(el.parentElement) el.parentElement.removeChild(el); }, 220);
}

// ── 圖片獨立儲存區（IndexedDB），封面圖用，避免塞爆 localStorage ──
function idbOpenImageDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('videoflow_images', 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains('images')) req.result.createObjectStore('images'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbPutImage(key, dataUrl){
  const db = await idbOpenImageDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('images','readwrite');
    tx.objectStore('images').put(dataUrl, key);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
async function idbGetImage(key){
  const db = await idbOpenImageDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('images','readonly');
    const req = tx.objectStore('images').get(key);
    req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
  });
}
async function idbDeleteImage(key){
  const db = await idbOpenImageDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('images','readwrite');
    tx.objectStore('images').delete(key);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
const IDB_IMG_PREFIX = 'idbref:';
const _cloudImgUploading = new Set();
const _idbOffloadCache = new Map();

let videoProjects = [];
// ── 影片封面圖片（p.steps.coverStyle.coverImage / coverImageShorts / coverImageSingle）：
//    跟書籤／娛樂清單的縮圖一樣，上傳的圖片如果是 base64（data:...），要先搬到 IndexedDB、
//    背景上傳雲端 Storage 換成一個網址，本機／雲端同步資料裡才只留一個短短的參照字串。
//    這三個欄位是「巢狀」放在 p.steps.coverStyle 裡（不是專案物件最上層），
//    所以不能直接沿用 offloadImagesForSave／restoreImagesAfterLoad（它們只認最上層欄位），
//    這裡另外寫一組專門處理巢狀欄位的版本，行為邏輯完全對齊。
const VF_COVER_FIELDS = ['coverImage','coverImageShorts','coverImageSingle'];
function cloudUploadVfCoverIfNeeded(key, dataUrl, projectId, field){
  if(!window.cloudSync || !window.cloudSync.uploadImage) return;
  if(_cloudImgUploading.has(key)) return;
  _cloudImgUploading.add(key);
  window.cloudSync.uploadImage(key, dataUrl).then(url=>{
    _cloudImgUploading.delete(key);
    if(!url) return; // 離線或上傳失敗：圖片仍只保留在本機 IndexedDB，不影響使用
    const p = videoProjects.find(x=>x.id===projectId);
    if(p && p.steps && p.steps.coverStyle){
      p.steps.coverStyle[field] = url; // 直接把記憶體中的圖片欄位換成雲端網址
      try{ saveVideoProjectsLocal(); pushVideoFlowSync(); if(state.view==='videoflow') renderVideoFlowPage(); }catch(e){ console.error('影片封面上傳後重新存檔失敗', e); }
    }
  }).catch(e=>{
    _cloudImgUploading.delete(key);
    console.warn('影片封面雲端上傳失敗，僅保留本機', key, e);
  });
}
function offloadVfCoverImages(list){
  if(!Array.isArray(list) || !list.length) return list;
  let changed = false;
  const out = list.map(item=>{
    if(!item || !item.steps || !item.steps.coverStyle) return item;
    let csCopy = null;
    VF_COVER_FIELDS.forEach(f=>{
      const v = item.steps.coverStyle[f];
      if(isDataUrl(v)){
        const key = `videoflow_${item.id}_${f}`;
        if(_idbOffloadCache.get(key) !== v){
          idbPutImage(key, v).catch(e=>console.warn('影片封面存入 IndexedDB 失敗', e));
          _idbOffloadCache.set(key, v);
          cloudUploadVfCoverIfNeeded(key, v, item.id, f);
        }
        if(!csCopy) csCopy = {...item.steps.coverStyle};
        csCopy[f] = IDB_IMG_PREFIX+key;
        changed = true;
      }
    });
    return csCopy ? {...item, steps:{...item.steps, coverStyle: csCopy}} : item;
  });
  return changed ? out : list;
}
function restoreVfCoverImages(list, onDone){
  if(!Array.isArray(list) || !list.length) return;
  const jobs = [];
  list.forEach(item=>{
    if(!item || !item.steps || !item.steps.coverStyle) return;
    VF_COVER_FIELDS.forEach(f=>{
      const v = item.steps.coverStyle[f];
      if(typeof v==='string' && v.indexOf(IDB_IMG_PREFIX)===0){
        const key = v.slice(IDB_IMG_PREFIX.length);
        jobs.push(idbGetImage(key).then(dataUrl=>{ if(dataUrl) item.steps.coverStyle[f]=dataUrl; }).catch(()=>{}));
      }
    });
  });
  if(jobs.length) Promise.all(jobs).then(()=>{ try{ onDone && onDone(); }catch(e){} });
}
function loadVideoProjects(){
  try{ videoProjects = JSON.parse(localStorage.getItem('lv_video_projects')) || []; }catch(e){ videoProjects = []; }
  restoreVfCoverImages(videoProjects, ()=>{ try{ if(state.view==='videoflow') renderVideoFlowPage(); }catch(e){} });
}
function saveVideoProjectsLocal(){ localStorage.setItem('lv_video_projects', JSON.stringify(offloadVfCoverImages(videoProjects))); }
function pushVideoFlowSync(){
  if(!window.cloudSync) return;
  return window.cloudSync.push('videoflow', { videoProjects: offloadVfCoverImages(videoProjects), vfLabel: loadVfLabel() });
}
function saveVideoProjects(){ saveVideoProjectsLocal(); pushVideoFlowSync(); }

// ── 匯出／匯入備份檔：這個獨立版沒有雲端同步，資料只存在目前這個瀏覽器的 localStorage／IndexedDB，
//    換一個瀏覽器或裝置就會看不到之前的資料，所以提供手動匯出一份 JSON 檔、之後可以在別的瀏覽器匯入回來 ──
const VF_TEXT_PROMPT_KEYS = ['lv_video_analyze_prompt','lv_video_lyrics_prompt','lv_video_promptopt_prompt','lv_video_cover_prompt','lv_video_cover_shorts_prompt','lv_video_cover_single_prompt','lv_video_cover_title_prompt','lv_video_subtitle_prompt','lv_video_caption_prompt','lv_video_yttitle_prompt'];
const VF_JSON_PROMPT_KEYS = ['lv_video_step_links','lv_video_step_titles'];
async function vfResolvePendingCoverImages(){
  // 封面圖片存進資料時會被換成 idbref: 開頭的參照字串（實際圖片在 IndexedDB），
  // 匯出備份檔前要先把這些參照換回真正的圖片資料，備份檔在別的瀏覽器打開才看得到封面圖
  const jobs = [];
  videoProjects.forEach(item=>{
    if(!item || !item.steps || !item.steps.coverStyle) return;
    VF_COVER_FIELDS.forEach(f=>{
      const v = item.steps.coverStyle[f];
      if(typeof v==='string' && v.indexOf(IDB_IMG_PREFIX)===0){
        const key = v.slice(IDB_IMG_PREFIX.length);
        jobs.push(idbGetImage(key).then(dataUrl=>{ if(dataUrl) item.steps.coverStyle[f]=dataUrl; }).catch(()=>{}));
      }
    });
  });
  if(jobs.length) await Promise.all(jobs);
}
async function vfExportData(){
  try{
    toast('☁️ 準備備份檔中…');
    await vfResolvePendingCoverImages();
    const data = { app:'videoflow', version:1, exportedAt: Date.now(), vfLabel: loadVfLabel(), videoProjects, textPrompts:{}, jsonPrompts:{} };
    VF_TEXT_PROMPT_KEYS.forEach(k=>{ const v = localStorage.getItem(k); if(v!==null) data.textPrompts[k]=v; });
    VF_JSON_PROMPT_KEYS.forEach(k=>{ const v = localStorage.getItem(k); if(v!==null){ try{ data.jsonPrompts[k]=JSON.parse(v); }catch(e){} } });
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `videoflow-備份-${fmtDate(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('✅ 已匯出備份檔，請妥善保存，換瀏覽器／裝置時可以用它匯入回來');
  }catch(e){
    console.error('匯出失敗', e);
    toast('❌ 匯出失敗，請再試一次');
  }
}
function vfImportDataFromFile(input){
  const file = input.files && input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('❌ 這不是有效的備份檔'); input.value=''; return; }
    if(!data || data.app!=='videoflow' || !Array.isArray(data.videoProjects)){ toast('❌ 這不是有效的「影片製作流程」備份檔'); input.value=''; return; }
    const n = data.videoProjects.length;
    if(!confirm(`確定要匯入這份備份檔嗎？\n\n裡面有 ${n} 個影片專案，匯入後會「覆蓋」目前這個瀏覽器上的所有影片專案與自訂提示詞，此動作無法復原。`)){ input.value=''; return; }
    videoProjects = data.videoProjects;
    saveVideoProjects();
    if(data.vfLabel) saveVfLabel(data.vfLabel);
    if(data.textPrompts){ Object.keys(data.textPrompts).forEach(k=>{ if(data.textPrompts[k]!==undefined && data.textPrompts[k]!==null) localStorage.setItem(k, data.textPrompts[k]); }); }
    if(data.jsonPrompts){ Object.keys(data.jsonPrompts).forEach(k=>{ try{ localStorage.setItem(k, JSON.stringify(data.jsonPrompts[k])); }catch(e){} }); }
    vfState.selectedProjectId = null;
    input.value = '';
    renderVideoFlowNav();
    renderVideoFlowPage();
    toast(`✅ 已匯入 ${n} 個影片專案與自訂提示詞`);
  };
  reader.onerror = () => { toast('❌ 讀取備份檔失敗，請再試一次'); input.value=''; };
  reader.readAsText(file);
}

// ── 分析步驟專用的固定提示詞模板：內容預設固定，但可編輯，編輯後全部專案共用同一份 ──
const VF_ANALYZE_PROMPT_DEFAULT = `請幫我拆解分析這首歌曲，我要用來當作寫 Suno AI 提示詞的參考依據，請用條列的方式整理以下重點：

4. 主要樂器編制與編曲手法
5. 人聲特質（性別、音色、唱腔、情緒處理方式）
6. 整體情緒與敘事氛圍
7. 段落結構安排（主歌／副歌／橋段怎麼鋪陳轉折）

請盡量用精確、具體、可以直接拿去當作曲風描述的詞彙來寫，我等等會拿這份拆解結果去優化 Suno 的提示詞。

這是這次要分析的歌曲連結：`;
// 最多 5 個提示詞版本，各自獨立保存內容與名稱，方便切換測試哪個效果比較好
const VF_ANALYZE_PROMPT_VERSION_COUNT = 5;
function vfDefaultAnalyzePromptVersions(){
  const arr = [];
  for(let i=0;i<VF_ANALYZE_PROMPT_VERSION_COUNT;i++){ arr.push({ name:'版本 '+(i+1), text: i===0 ? VF_ANALYZE_PROMPT_DEFAULT : '' }); }

}
function loadVfAnalyzePromptVersions(){
  try{
    const raw = localStorage.getItem('lv_video_analyze_prompt_versions');
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length===VF_ANALYZE_PROMPT_VERSION_COUNT) return arr;
    }
  }catch(e){}
  // 從舊版單一提示詞欄位搬過來，放進版本 1，其餘版本留空給使用者自己嘗試
  const defaults = vfDefaultAnalyzePromptVersions();
  const old = localStorage.getItem('lv_video_analyze_prompt');
  if(old!==null && old!==undefined) defaults[0].text = old;
  saveVfAnalyzePromptVersions(defaults);
  return defaults;
}

function loadVfAnalyzeActiveVersion(){

                <input type="file" accept="image/*" style="display:none" onchange="vfHandleCoverFile('${p.id}',this,'${field}')"/>

function vfIsWizardMode(projectId){
  const v = vfState.wizardMode[projectId];
  return v===undefined ? true : v;

function vfToggleWizardMode(projectId){
  const p = videoProjects.find(x=>x.id===projectId); if(!p) return;
  const turningOn = !vfIsWizardMode(projectId);

  if(turningOn){
    const visible = vfVisibleSteps(p);
    const next = visible.find(s=>!p.steps[s.key]?.done) || visible[visible.length-1];
    vfState.wizardStep[projectId] = next ? next.key : null;
    vfState.expandedStep[projectId] = vfState.wizardStep[projectId];
  }
  renderVideoFlowPage();
  if(turningOn) vfScrollToExpandedStep(projectId);

function vfWizardGoto(projectId, dir){
  const p = videoProjects.find(x=>x.id===projectId); if(!p) return;
  const visible = vfVisibleSteps(p);
  if(!visible.length) return;
  let idx = visible.findIndex(s=>s.key===vfState.wizardStep[projectId]);
  if(idx<0) idx = 0;
  idx = Math.max(0, Math.min(visible.length-1, idx+dir));
  vfState.wizardStep[projectId] = visible[idx].key;
  vfState.expandedStep[projectId] = visible[idx].key;
  renderVideoFlowPage();
  vfScrollToExpandedStep(projectId);

function vfToggleStepDone(projectId, stepKey, checked){
  const p = videoProjects.find(x=>x.id===projectId); if(!p) return;
  if(!p.steps[stepKey]) p.steps[stepKey] = {note:'', done:false};
  p.steps[stepKey].done = checked;
  p.lastEditedAt = Date.now();
  const idx = VIDEO_STEPS.findIndex(s=>s.key===stepKey);
  const stepInfo = VIDEO_STEPS[idx];
  const visible = vfVisibleSteps(p);
  const doneN = vfDoneCount(p);
  const total = vfTotalSteps(p);
  // 全部（可見的）步驟都完成時，記錄完成時間，供統計「平均花費天數」使用
  if(doneN>=total) p.completedAt = p.completedAt || Date.now();
  else p.completedAt = null;
  saveVideoProjects();
  if(checked){
    toast(`✅ 已完成「${stepInfo.title}」・進度 ${doneN} / ${total}`);
  } else {
    toast(`↩️ 已取消完成「${stepInfo.title}」`);
  }
  // 精靈模式下，勾完這一步就自動跳到下一個還沒完成的步驟
  if(checked && vfIsWizardMode(projectId)){
    const curIdx = visible.findIndex(s=>s.key===stepKey);
    const next = visible.slice(curIdx+1).find(s=>!p.steps[s.key]?.done) || visible.find(s=>!p.steps[s.key]?.done);
    vfState.wizardStep[projectId] = next ? next.key : stepKey;
    vfState.expandedStep[projectId] = vfState.wizardStep[projectId];
  }
  renderVideoFlowPage();
  if(checked && vfIsWizardMode(projectId)) vfScrollToExpandedStep(projectId);
}

          ${cs.tool==='其他' ? `<button class="icon-btn" onclick="vfEditCustomStepUrl('${p.id}','${cs.id}')" title="設定這個工具的網址"><i class="ti ti-pencil" style="font-size:12px"></i></button>` : ''}
        </div>
        <textarea class="inp" rows="3" placeholder="貼上這一步的產出／備註…" oninput="vfUpdateCustomStepNote('${p.id}','${cs.id}',this.value)">${esc(cs.note||'')}</textarea>
      </div>` : ''}
    </div>`;
}
// ── 略過步驟：有些專案用不到某幾步（例如不用 CapCut），可以標記略過，進度與「下一步」都會自動跳過它 ──
function vfToggleStepHidden(projectId, stepKey){
  const p = videoProjects.find(x=>x.id===projectId); if(!p) return;
  if(!p.hiddenSteps) p.hiddenSteps = [];
  const i = p.hiddenSteps.indexOf(stepKey);
  if(i>-1) p.hiddenSteps.splice(i,1); else p.hiddenSteps.push(stepKey);
  p.lastEditedAt = Date.now();
  saveVideoProjects();
  renderVideoFlowPage();
}
// ── 便利貼：專案卡片旁的小黃便利貼，隨手記東西用，不列入流程進度 ──
function vfToggleSticky(id){
  vfState.stickyOpen[id] = !vfState.stickyOpen[id];
  renderVideoFlowPage();
}
function vfUpdateSticky(id, value){
  const p = videoProjects.find(x=>x.id===id); if(!p) return;
  p.stickyNote = value;
  p.lastEditedAt = Date.now();
  saveVideoProjects();
}
// ── 封存：完成的專案可以收起來，主清單不會一直變長 ──
function vfArchiveProject(id, archived){
  const p = videoProjects.find(x=>x.id===id); if(!p) return;
  p.archived = archived;
  p.lastEditedAt = Date.now();
  saveVideoProjects();
  // 封存／取消封存後，如果目前選中的專案不再出現在這個清單裡（例如封存了但沒開「已封存」檢視），改選清單裡的第一個
  if(vfState.selectedProjectId===id){
    const list = vfGetFilteredSortedProjects();
    if(!list.find(x=>x.id===id)) vfState.selectedProjectId = list.length ? list[0].id : null;
  }
  renderVideoFlowPage();
  toast(archived ? '📦 已封存專案' : '📤 已取消封存');
}
// ── 複製為新專案模板：常做同系列影片時，複製一份流程設定（略過的步驟等），內容重新開始 ──
function vfDuplicateProject(id){
  const p = videoProjects.find(x=>x.id===id); if(!p) return;
  const proj = { id: uid(), title: p.title+'（複製）', createdAt: Date.now(), lastEditedAt: Date.now(), completedAt:null, archived:false, hiddenSteps:[...(p.hiddenSteps||[])], customSteps:(p.customSteps||[]).map(cs=>({...cs, id:uid(), done:false, note:''})), stickyNote:'', steps:{} };
  VIDEO_STEPS.forEach(s=>{ proj.steps[s.key] = {note:'', done:false, songLink: s.key==='analyze' ? '' : undefined}; });
  videoProjects.unshift(proj);
  saveVideoProjects();
  vfState.selectedProjectId = proj.id;
  renderVideoFlowPage();
  toast('✅ 已建立複製專案，流程設定沿用，內容重新開始記錄');
}
// ── 複製整支影片的完整製作紀錄成一段文字，方便存檔備份或整理成SOP ──
function vfCopyProjectSummary(id){
  const p = videoProjects.find(x=>x.id===id); if(!p) return;
  const hidden = p.hiddenSteps||[];
  const lines = [`🎬 ${p.title}`, `建立於 ${fmtDate(new Date(p.createdAt))}`, ''];
  const pushCustom = (afterKey) => {
    (p.customSteps||[]).filter(cs=>cs.afterKey===afterKey).sort((a,b)=>a.createdAt-b.createdAt).forEach(cs=>{
      lines.push(`🧩 ${cs.title}${cs.done?'（已完成）':'（未完成）'} ・ ${cs.tool}`);
      if(cs.note) lines.push(`　${cs.note}`);
      lines.push('');
    });
  };
  pushCustom('__start__');
  VIDEO_STEPS.forEach(s=>{
    if(hidden.includes(s.key)){ pushCustom(s.key); return; }
    const st = p.steps[s.key]||{};
    lines.push(`${s.emoji} ${vfGetStepTitle(s.key)}${st.done?'（已完成）':'（未完成）'}`);
    if(st.songLink) lines.push(`　連結：${st.songLink}`);
    if(st.note) lines.push(`　${st.note}`);
    lines.push('');
    pushCustom(s.key);
  });
  const text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('✅ 已複製整支影片的製作紀錄')).catch(()=>toast('複製失敗，請再試一次'));
  } else toast('複製失敗，請再試一次');
}
// ── 封面圖：直接上傳/替換一張縮圖，專案卡片會顯示小圖（field 區分影片／Shorts／單曲三組獨立縮圖）──
function vfSetCoverImage(projectId, dataUrl, field){
  field = field || 'coverImage';
  const p = videoProjects.find(x=>x.id===projectId); if(!p) return;
  if(!p.steps.coverStyle) p.steps.coverStyle = {note:'', done:false};
  p.steps.coverStyle[field] = dataUrl;
  p.lastEditedAt = Date.now();
  saveVideoProjects();
  renderVideoFlowPage();
  toast('✅ 已更新封面縮圖');
}
function vfRemoveCoverImage(projectId, field){
  field = field || 'coverImage';
  const p = videoProjects.find(x=>x.id===projectId); if(!p) return;
  if(p.steps.coverStyle) p.steps.coverStyle[field] = '';
  saveVideoProjects(); renderVideoFlowPage();
}
function vfCoverImgError(imgEl){
  const div = document.createElement('div');
  div.className = 'vf-cover-thumb-lg';
  div.style.cssText = 'display:flex;align-items:center;justify-content:center;color:var(--danger)';
  div.title = '圖片讀取失敗，網址可能已失效或該網站不允許外部連結引用';
  div.innerHTML = '<i class="ti ti-photo-off" style="font-size:20px"></i>';
  imgEl.replaceWith(div);
}
function vfIsSafeImageUrl(url){
  try{
    const u = new URL(url);
    return u.protocol==='http:' || u.protocol==='https:';
  }catch(e){ return false; }
}
function vfSetCoverImageFromUrl(projectId, url, field){
  url = (url||'').trim();
  if(!url){ toast('請先貼上圖片網址'); return; }
  // 使用者常常忘記打 https://，直接補上，不然會被誤判成相對路徑，存進一個永遠抓不到圖的錯誤網址
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url.replace(/^\/+/, '');
  if(!vfIsSafeImageUrl(url)){ toast('網址格式不正確，請貼上 http(s) 開頭的圖片網址'); return; }
  vfSetCoverImage(projectId, url, field);
}
function vfHandleCoverFile(projectId, input, field){
  const file = input.files && input.files[0]; if(!file) return;
  if(file.size > 3*1024*1024){ toast('圖片檔案過大，請選擇 3MB 以下的圖片'); return; }
  const reader = new FileReader();
  reader.onload = () => vfSetCoverImage(projectId, reader.result, field);
  reader.onerror = () => toast('圖片讀取失敗，請再試一次');
  reader.readAsDataURL(file);
}
// ── 從文字中偵測 YouTube 連結，上傳步驟填了連結就自動顯示縮圖預覽 ──
function vfExtractYoutubeId(text){
  if(!text) return null;
  const m = text.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([a-zA-Z0-9_-]{6,15})/);
  return m ? m[1] : null;
}
// ── 搜尋／篩選／排序／封存清單切換／統計面板 ──
function vfSetSearch(v){ vfState.search = v; vfRenderFilteredList(); }
function vfSetFilterStatus(v){ vfState.filterStatus = v; renderVideoFlowPage(); }
function vfSetSortBy(v){ vfState.sortBy = v; renderVideoFlowPage(); }
function vfToggleShowArchived(){ vfState.showArchived = !vfState.showArchived; renderVideoFlowPage(); }
function vfToggleStats(){ vfState.showStats = !vfState.showStats; renderVideoFlowPage(); }
function vfRenderFilteredList(){
  // 搜尋框單獨處理，避免整頁重繪讓輸入框失焦
  const wrap = document.getElementById('vf-sidebar-list'); if(!wrap) return;
  const list = vfGetFilteredSortedProjects();
  if(list.length && !list.find(p=>p.id===vfState.selectedProjectId)){
    vfState.selectedProjectId = list[0].id;
    renderVideoFlowPage();
    return;
  }
  wrap.innerHTML = list.length ? list.map(p=>vfSidebarItemHTML(p)).join('') : `<div class="ent-empty" style="padding:30px 10px;font-size:13px"><i class="ti ti-search-off"></i><br/>找不到符合條件的影片專案</div>`;
}
function vfGetFilteredSortedProjects(){
  const q = (vfState.search||'').trim().toLowerCase();
  let list = videoProjects.filter(p => !!p.archived === !!vfState.showArchived);
  if(q) list = list.filter(p=>p.title.toLowerCase().includes(q));
  if(vfState.filterStatus!=='all'){
    list = list.filter(p=>{
      const n = vfDoneCount(p), total = vfVisibleSteps(p).length;
      if(vfState.filterStatus==='notstarted') return n===0;
      if(vfState.filterStatus==='inprogress') return n>0 && n<total;
      if(vfState.filterStatus==='done') return n>=total && total>0;
      return true;
    });
  }
  const sortBy = vfState.sortBy;
  list = [...list].sort((a,b)=>{
    if(sortBy==='created') return b.createdAt-a.createdAt;
    if(sortBy==='title') return a.title.localeCompare(b.title,'zh-Hant');
    return (b.lastEditedAt||b.createdAt)-(a.lastEditedAt||a.createdAt); // 預設：最後編輯時間
  });
  return list;
}
function vfComputeStats(){
  const active = videoProjects.filter(p=>!p.archived);
  const now = new Date(); const curMonth = now.getMonth(), curYear = now.getFullYear();
  const completed = videoProjects.filter(p=>p.completedAt);
  const completedThisMonth = completed.filter(p=>{ const d=new Date(p.completedAt); return d.getMonth()===curMonth && d.getFullYear()===curYear; }).length;
  const avgDays = completed.length ? Math.round(completed.reduce((sum,p)=>sum+(p.completedAt-p.createdAt),0)/completed.length/86400000*10)/10 : null;
  // 統計「卡最多次」的步驟：還沒做完的專案，各自的下一步是哪一個
  const stuckCount = {};
  active.forEach(p=>{
    const visible = vfVisibleSteps(p);
    const next = visible.find(s=>!p.steps[s.key]?.done);
    if(next) stuckCount[next.key] = (stuckCount[next.key]||0)+1;
  });
  let stuckKey = null, stuckMax = 0;
  Object.keys(stuckCount).forEach(k=>{ if(stuckCount[k]>stuckMax){ stuckMax=stuckCount[k]; stuckKey=k; } });
  return { total: active.length, completedThisMonth, avgDays, stuckKey, stuckMax };
}

            <div class="vf-stats-card"><div class="vf-stats-num" style="font-size:13px">${stats.stuckKey?esc(vfGetStepTitle(stats.stuckKey)):'—'}</div><div class="vf-stats-label">最常卡關${stats.stuckMax?`（${stats.stuckMax}支）`:''}</div></div>
          </div>` : ''}
          <div class="vf-sidebar-list" id="vf-sidebar-list">

          ${vfState.captionPromptEditing ? `
          <textarea class="inp" id="vf-caption-prompt-edit" rows="8">${esc(loadVfCaptionPrompt())}</textarea>

          <div class="sn-insp-prompt-box vf-prompt-preview${vfState.captionPromptPreviewExpanded?' expanded':''}"><div class="sn-insp-prompt-en" style="white-space:pre-wrap">${esc(loadVfCaptionPrompt())}</div></div>

        </div>

        <div class="vf-step-actions">
          <button class="btn-ghost" style="font-size:11px;padding:5px 9px" onclick="vfOpenTool('${s.key}')"><i class="ti ti-external-link" style="font-size:12px"></i> 前往 ${esc(s.tool)}</button>
          <button class="icon-btn" onclick="vfEditStepLink('${s.key}')" title="設定這一步要開啟的工具連結"><i class="ti ti-pencil" style="font-size:12px"></i></button>

          <div class="vf-prompt-version-tabs">

            <button type="button" class="btn-ghost" style="font-size:11px;padding:5px 10px" onclick="vfCancelPromptEdit()">取消</button>

          <div class="sn-insp-prompt-box vf-prompt-preview${vfState.promptPreviewExpanded?' expanded':''}"><div class="sn-insp-prompt-en" style="white-space:pre-wrap">${esc(loadVfAnalyzePrompt()) || '<span style="color:var(--text3)">這個版本還沒有內容，點下面「編輯提示詞」開始寫</span>'}</div></div>
          <button type="button" class="btn-ghost" style="font-size:10.5px;padding:4px 8px;margin-top:6px" onclick="vfTogglePromptPreview()"><i class="ti ti-chevron-${vfState.promptPreviewExpanded?'up':'down'}" style="font-size:11px"></i> ${vfState.promptPreviewExpanded?'收合':'展開查看完整內容'}</button>
          <button type="button" class="btn-ghost" style="font-size:10.5px;padding:4px 8px;margin-top:8px" onclick="vfTogglePromptEdit()"><i class="ti ti-pencil" style="font-size:11px"></i> 編輯提示詞</button>
          `}
        </div>
        <div class="form-group">
          <label class="form-label">這次想要分析的歌曲連結</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input class="inp" style="flex:1" id="vf-songlink-${p.id}" placeholder="貼上這次參考的 YouTube 連結" value="${esc(st.songLink||'')}" oninput="vfUpdateSongLink('${p.id}',this.value);vfToggleClearBtn('vf-songlink-clear-${p.id}',this.value)"/>
            <button type="button" class="icon-btn" id="vf-songlink-clear-${p.id}" style="${st.songLink?'':'display:none'}" onclick="vfClearSongLink('${p.id}')" title="清除連結，準備貼下一首"><i class="ti ti-x" style="font-size:13px"></i></button>
          </div>
        </div>
        <div class="vf-step-actions">
          <button class="btn-ghost" style="font-size:11px;padding:5px 9px" onclick="vfCopyAnalyzeBundle('${p.id}')"><i class="ti ti-copy" style="font-size:12px"></i> 複製提示詞＋連結，開啟 Gemini</button>
          <button class="icon-btn" onclick="vfEditStepLink('${s.key}')" title="設定 Gemini Gem 連結"><i class="ti ti-pencil" style="font-size:12px"></i></button>
        </div>
        ${!url ? `<div class="vf-step-nolink">還沒設定連結，點上面鉛筆圖示貼上你的 Gemini Gem 網址，設定一次全部專案都能用</div>` : ''}
        `}
      </div>` : ''}
    </div>`;
}
